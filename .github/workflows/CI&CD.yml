name: Deployment with separate jobs
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Run ESLint
        run: yarn lint
      - name: Run tests
        run: yarn test:run
  build: 
    needs: test
    runs-on: ubuntu-latest
    outputs:
      script-file-in-job: ${{ steps.jsfile.outputs.script-file-in-step }} 
    steps:
      - name: Get code
        uses: actions/checkout@v6
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Build project
        run: yarn build
      - name: Publish JS filename
        id: jsfile
        run: find .next/*.js -type f -execdir echo 'script-file-in-step={}' >> $GITHUB_OUTPUT ';'
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nextjs-build-artifacts
          include-hidden-files: true
          path: |
            .next
            public
            package.json
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Get build artifacts
        uses: actions/download-artifact@v8
        with:
          name: nextjs-build-artifacts
      - name: Output contents
        run: ls -la
      - name: Output Js filename
        run: echo "${{ needs.build.outputs.script-file-in-job }}"
      - name: Deploy code
        run: echo "Deploying code..." # Replace this with your actual deployment command
  report: 
    needs: [lint, deploy]
    if: failure()
    steps:
      - name: Output information
        run: |
          echo "Running report job when previous job failed"
          echo "${{ toJSON(github) }}" 