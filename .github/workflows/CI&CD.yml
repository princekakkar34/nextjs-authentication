name: Deployment with separate jobs
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Run ESLint
        run: yarn lint
      - name: Force test failure
        run: exit 1
  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      script-file-in-job: ${{ steps.jsfile.outputs.script-file-in-step }}
    steps:
      - name: Get code
        uses: actions/checkout@v6
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Build project
        run: yarn build
      - name: Publish JS filename
        id: jsfile
        run: |
          find .next/*.js -type f -execdir echo 'script-file-in-step={}' >> "$GITHUB_OUTPUT" ';'
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nextjs-build-artifacts
          include-hidden-files: true
          path: |
            .next
            public
            package.json
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Get build artifacts
        uses: actions/download-artifact@v8
        with:
          name: nextjs-build-artifacts
      - name: Output contents
        run: ls -la
      - name: Output JS filename
        run: echo "${{ needs.build.outputs.script-file-in-job }}"
      - name: Deploy code
        run: echo "Deploying code..."
  report:
    needs: [test, build, deploy]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    steps:
      - name: Output information
        env:
          GITHUB_CONTEXT: ${{ toJSON(github) }}
        run: |
          echo "Running report job when previous job failed"
          echo "$GITHUB_CONTEXT"